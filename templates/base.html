<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Catálogo de Filmes{% endblock %}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f4f4;
        color: #222;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
      nav {
        background: #1f2937;
        padding: 16px 0;
      }
      nav .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 0;
        padding-bottom: 0;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        margin-right: 16px;
        font-weight: bold;
      }
      .btn {
        display: inline-block;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-primary {
        background: #2563eb;
        color: #fff;
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #111827;
      }
      .btn-danger {
        background: #dc2626;
        color: #fff;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th, td {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      th {
        background: #f8fafc;
      }
      form {
        display: grid;
        gap: 16px;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      input, select {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 16px;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .flash {
        margin: 20px 0;
        padding: 12px 16px;
        border-radius: 8px;
        background: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
      }
      .empty {
        padding: 20px;
        background: #fff;
        border-radius: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="container">
        <div>
          <a href="{{ url_for('index') }}">Catálogo</a>
        </div>
        <div>
          <a href="{{ url_for('novo_filme') }}">Novo filme</a>
        </div>
      </div>
    </nav>

    <main class="container">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
